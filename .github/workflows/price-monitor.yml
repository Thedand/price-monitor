name: Price monitor

on:
  workflow_dispatch:
  schedule:
    # Avoid the start-of-hour Actions load peak, where scheduled runs can be delayed or dropped.
    - cron: '17 9 * * 1'
      timezone: 'Europe/Chisinau'

concurrency:
  group: price-monitor
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-publish:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect prices and rebuild reports
        shell: pwsh
        run: ./run.ps1

      - name: Commit updated data
        shell: pwsh
        run: ./publish-generated-data.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
